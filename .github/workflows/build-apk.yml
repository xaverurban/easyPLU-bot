name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          
      - name: Show project structure
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== app folder ==="
          ls -la app 2>/dev/null || echo "NO app FOLDER"
          echo "=== app/build.gradle ==="
          cat app/build.gradle 2>/dev/null || echo "MISSING app/build.gradle"
          echo "=== source files ==="
          find app/src -type f 2>/dev/null || echo "NO app/src"
          echo "=== gradle projects ==="
          gradle projects --no-daemon

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate the APK
        run: |
          echo "=== everything under app/build/outputs ==="
          find app/build/outputs -type f 2>/dev/null || echo "(no outputs folder)"
          echo "=== every APK in the project ==="
          find . -name '*.apk' 2>/dev/null || true

          APK=$(find . -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK was produced - see the listing above."
            exit 1
          fi
          mkdir -p out
          cp "$APK" out/easyPLU-Bot.apk
          echo "Found: $APK"
          ls -lh out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: easyPLU-Bot-APK
          path: out/easyPLU-Bot.apk
          if-no-files-found: error
