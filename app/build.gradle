plugins {
    id 'com.android.application'
}

android {
    namespace 'com.easyplu.bot'
    compileSdk 34

    defaultConfig {
        applicationId "com.easyplu.bot"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign release builds with the debug key so the CI artifact
            // installs directly on a phone without extra setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // No AndroidX / no external libraries - keeps the build simple and fast.
}

dependencies { }
